name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: python -m pip install --upgrade pip

      # This also exercises the batchr git dependency. fetchr pins it as
      # `batchr @ git+https://github.com/nikhilcherry/batchr`, so a rename or a
      # move of that repo breaks installation here and nowhere else.
      - run: pip install -e ".[dev]"

      - run: pytest -q
